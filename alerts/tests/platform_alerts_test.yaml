# Unit tests for the Kubernetes and gRPC alerts (run via `make test-alerts`).
# exp_annotations mirror the rules verbatim on purpose — editing an alert message must update
# this test, keeping the two in sync.
rule_files:
  - ../.extracted/rules-platform.yaml
evaluation_interval: 1m
tests:
  # A restart every 5 minutes: 6 in the last 30m -> PodRestartLoop fires (p0).
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '0+0.2x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: PodRestartLoop
        exp_alerts:
          - exp_labels:
              severity: p0
              team: platform
              namespace: shop
              pod: api-0
              container: api
            exp_annotations:
              summary: "Pod api-0 restarting frequently"
              description: "api on api-0 restarted 6 times in the last 30 minutes."

  # Two restarts in the last 30m -> silent (the threshold is more than 3).
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '0x20 1x10 2x30'
    alert_rule_test:
      - eval_time: 40m
        alertname: PodRestartLoop
        exp_alerts: []

  # 3 restarts in the last 30m from a counter at 10 -> silent: increase() reads 3.1, floor() 3.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '10x40 11x5 12x5 13x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: PodRestartLoop
        exp_alerts: []

  # 4 restarts in the last 30m from a counter at 10 -> fires.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '10x35 11x5 12x5 13x5 14x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: PodRestartLoop
        exp_alerts:
          - exp_labels:
              severity: p0
              team: platform
              namespace: shop
              pod: api-0
              container: api
            exp_annotations:
              summary: "Pod api-0 restarting frequently"
              description: "api on api-0 restarted 4 times in the last 30 minutes."

  # A jump of 4 restarts at 30m: true from 30m, so one minute before the 5m dwell completes
  # -> silent.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '0x30 4x30'
    alert_rule_test:
      - eval_time: 34m
        alertname: PodRestartLoop
        exp_alerts: []

  # An OOM kill restarts the container at 10m -> PodOOMKilled fires on that restart, then
  # resolves once the restart is older than the 10m window, although the last termination
  # reason still reads OOMKilled.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop", pod="api-0", container="api", reason="OOMKilled"}'
        values: '_x10 1x50'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '0x10 1x50'
    alert_rule_test:
      - eval_time: 13m
        alertname: PodOOMKilled
        exp_alerts:
          - exp_labels:
              severity: p0
              team: platform
              namespace: shop
              pod: api-0
              container: api
              reason: OOMKilled
            exp_annotations:
              summary: "Pod api-0 OOM killed"
              description: "Container api on api-0 was terminated due to OOM. Bump memory request/limit or find the leak."
      - eval_time: 30m
        alertname: PodOOMKilled
        exp_alerts: []

  # OOM restart at 10m: pending at 10m (one minute before the 1m dwell completes), and
  # silent at 21m, when the restart has left the 10m window.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop", pod="api-0", container="api", reason="OOMKilled"}'
        values: '_x10 1x50'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '0x10 1x50'
    alert_rule_test:
      - eval_time: 10m
        alertname: PodOOMKilled
        exp_alerts: []
      - eval_time: 21m
        alertname: PodOOMKilled
        exp_alerts: []

  # A restart whose last termination was not an OOM kill -> PodOOMKilled silent.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop", pod="api-0", container="api", reason="Error"}'
        values: '_x10 1x20'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 13m
        alertname: PodOOMKilled
        exp_alerts: []

  # Known limitation, pinned: a container OOM-killed but not restarted in place (a Job pod
  # with restartPolicy Never) has no restart to pair with, so PodOOMKilled stays silent.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop", pod="api-0", container="api", reason="OOMKilled"}'
        values: '_x10 1x30'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: PodOOMKilled
        exp_alerts: []

  # The proxy sidecar's last termination was an OOM kill long ago; the api container restarts
  # at 10m after an error -> silent: the restart is paired with its own container only.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop", pod="api-0", container="proxy", reason="OOMKilled"}'
        values: '1x40'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="proxy"}'
        values: '2x40'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop", pod="api-0", container="api", reason="Error"}'
        values: '1x40'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop", pod="api-0", container="api"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 13m
        alertname: PodOOMKilled
        exp_alerts: []

  # api at 900MiB of a 1GiB limit (87.9%) for 10m -> HighMemory fires. The pod's proxy sidecar
  # sits at 10% of its own limit, and the pod cgroup (container="") and the pause container
  # ("POD") are left out: only api fires. One-to-one matching on (...) keeps only the three
  # join labels.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="api"}'
        values: '943718400x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte"}'
        values: '1073741824x20'
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="proxy"}'
        values: '13421772.8x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="proxy", resource="memory", unit="byte"}'
        values: '134217728x20'
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container=""}'
        values: '2147483648x20'
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="POD"}'
        values: '2147483648x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              namespace: shop
              pod: api-0
              container: api
            exp_annotations:
              summary: "Container memory usage > 85% of limit"
              description: "Container api on api-0 is using 87.89% of its memory limit. OOM risk."

  # 500MiB of a 1GiB limit -> HighMemory silent.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="api"}'
        values: '524288000x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte"}'
        values: '1073741824x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts: []

  # Known limitation, pinned: a container with no memory limit has nothing to divide by, so
  # HighMemory never judges it, however much it uses.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="batch-0", container="batch"}'
        values: '68719476736x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts: []

  # A container whose application exports no metrics of its own is still judged: the
  # working set comes from the kubelet.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="api"}'
        values: '1063256064x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte"}'
        values: '1073741824x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              namespace: shop
              pod: api-0
              container: api
            exp_annotations:
              summary: "Container memory usage > 85% of limit"
              description: "Container api on api-0 is using 99.02% of its memory limit. OOM risk."

  # Two processes at 50% of the limit each in one container: the cgroup's working set counts
  # both, 100% of the limit -> fires.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="api"}'
        values: '1073741824x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte"}'
        values: '1073741824x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              namespace: shop
              pod: api-0
              container: api
            exp_annotations:
              summary: "Container memory usage > 85% of limit"
              description: "Container api on api-0 is using 100% of its memory limit. OOM risk."

  # api-0 at 88%, and the kubelet scraped by two jobs, so worker-0 has two working-set series
  # -> HighMemory still evaluates and fires for api-0.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="api", job="kubelet"}'
        values: '943718400x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte"}'
        values: '1073741824x20'
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="worker-0", container="worker", job="kubelet"}'
        values: '104857600x20'
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="worker-0", container="worker", job="cadvisor"}'
        values: '104857600x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="worker-0", container="worker", resource="memory", unit="byte"}'
        values: '1073741824x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              namespace: shop
              pod: api-0
              container: api
            exp_annotations:
              summary: "Container memory usage > 85% of limit"
              description: "Container api on api-0 is using 87.89% of its memory limit. OOM risk."

  # api-0 at 88% with two kube-state-metrics replicas reporting its limit -> still fires.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="api"}'
        values: '943718400x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte", instance="ksm-a"}'
        values: '1073741824x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte", instance="ksm-b"}'
        values: '1073741824x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              namespace: shop
              pod: api-0
              container: api
            exp_annotations:
              summary: "Container memory usage > 85% of limit"
              description: "Container api on api-0 is using 87.89% of its memory limit. OOM risk."

  # Exactly 85% -> silent (the rule says over 85%). 70% -> silent. 88% from 0m: silent one
  # minute before the 10m dwell completes, firing at 10m.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="api"}'
        values: '912680550.4x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte"}'
        values: '1073741824x20'
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-1", container="api"}'
        values: '751619276.8x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-1", container="api", resource="memory", unit="byte"}'
        values: '1073741824x20'
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-2", container="api"}'
        values: '943718400x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-2", container="api", resource="memory", unit="byte"}'
        values: '1073741824x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: HighMemory
        exp_alerts: []
      - eval_time: 10m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              namespace: shop
              pod: api-2
              container: api
            exp_annotations:
              summary: "Container memory usage > 85% of limit"
              description: "Container api on api-2 is using 87.89% of its memory limit. OOM risk."
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              namespace: shop
              pod: api-2
              container: api
            exp_annotations:
              summary: "Container memory usage > 85% of limit"
              description: "Container api on api-2 is using 87.89% of its memory limit. OOM risk."

  # 860,000,000 bytes of a 1,000,000,000-byte limit (86%) -> fires.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="api"}'
        values: '860000000x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte"}'
        values: '1000000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              namespace: shop
              pod: api-0
              container: api
            exp_annotations:
              summary: "Container memory usage > 85% of limit"
              description: "Container api on api-0 is using 86% of its memory limit. OOM risk."

  # A memory limit with no working-set series (cAdvisor not scraped) -> silent: there is
  # nothing to divide.
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="api", resource="memory", unit="byte"}'
        values: '1000000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts: []

  # A pause container ("POD") at 90% of a limit series of its own -> silent, only through the
  # container!="POD" matcher.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="shop", pod="api-0", container="POD"}'
        values: '900000000x20'
      - series: 'kube_pod_container_resource_limits{namespace="shop", pod="api-0", container="POD", resource="memory", unit="byte"}'
        values: '1000000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighMemory
        exp_alerts: []

  # Checkout: 6 calls a minute (0.1/s), every one between 2.5s and 5s -> 100% slower than 2.5s,
  # above the 0.05/s traffic floor -> GRPCHighLatency fires.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Checkout", grpc_type="unary", le="0.5"}'
        values: '0x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Checkout", grpc_type="unary", le="1"}'
        values: '0x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Checkout", grpc_type="unary", le="2.5"}'
        values: '0x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Checkout", grpc_type="unary", le="5"}'
        values: '0+6x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Checkout", grpc_type="unary", le="+Inf"}'
        values: '0+6x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="Checkout", grpc_type="unary"}'
        values: '0+6x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GRPCHighLatency
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              grpc_service: shop.Cart
              grpc_method: Checkout
            exp_annotations:
              summary: "gRPC method shop.Cart/Checkout: more than 1% of calls slower than 2.5s"
              description: "100% of calls to shop.Cart/Checkout took longer than 2.5s over 10m. A user-facing RPC that slow points to a handler regression — check the handler's downstream dependencies (database, external APIs)."
      - eval_time: 30m
        alertname: GRPCLatencyBucketMissing
        exp_alerts: []

  # The same slow calls at 1 a minute (0.017/s), under the traffic floor -> silent: one slow
  # call on a quiet method does not page.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Export", grpc_type="unary", le="2.5"}'
        values: '0x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Export", grpc_type="unary", le="5"}'
        values: '0+1x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Export", grpc_type="unary", le="+Inf"}'
        values: '0+1x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="Export", grpc_type="unary"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GRPCHighLatency
        exp_alerts: []

  # Busy and fast: every call under 0.5s -> silent, and the histogram has the 2.5s bucket, so
  # GRPCLatencyBucketMissing is silent too.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Get", grpc_type="unary", le="0.5"}'
        values: '0+60x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Get", grpc_type="unary", le="2.5"}'
        values: '0+60x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Get", grpc_type="unary", le="+Inf"}'
        values: '0+60x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="Get", grpc_type="unary"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GRPCHighLatency
        exp_alerts: []
      - eval_time: 30m
        alertname: GRPCLatencyBucketMissing
        exp_alerts: []

  # Every call between 1s and 2.5s at 1 a second -> silent: none is slower than 2.5s, however
  # an interpolated p99 would read them.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Update", grpc_type="unary", le="1"}'
        values: '0x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Update", grpc_type="unary", le="2.5"}'
        values: '0+60x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Update", grpc_type="unary", le="+Inf"}'
        values: '0+60x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="Update", grpc_type="unary"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: GRPCHighLatency
        exp_alerts: []
      - eval_time: 30m
        alertname: GRPCHighLatency
        exp_alerts: []

  # 97.5% of calls under 1s and 2.5% between 1s and 2.5s -> silent.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="List", grpc_type="unary", le="1"}'
        values: '0+117x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="List", grpc_type="unary", le="2.5"}'
        values: '0+120x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="List", grpc_type="unary", le="+Inf"}'
        values: '0+120x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="List", grpc_type="unary"}'
        values: '0+120x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GRPCHighLatency
        exp_alerts: []

  # 97% of calls under 1s and 3% slower than 2.5s, at 100 a minute: true from 1m, so silent one
  # minute before the 10m dwell completes, and firing at 30m.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Pay", grpc_type="unary", le="1"}'
        values: '0+97x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Pay", grpc_type="unary", le="2.5"}'
        values: '0+97x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Pay", grpc_type="unary", le="+Inf"}'
        values: '0+100x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="Pay", grpc_type="unary"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: GRPCHighLatency
        exp_alerts: []
      - eval_time: 30m
        alertname: GRPCHighLatency
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              grpc_service: shop.Cart
              grpc_method: Pay
            exp_annotations:
              summary: "gRPC method shop.Cart/Pay: more than 1% of calls slower than 2.5s"
              description: "3% of calls to shop.Cart/Pay took longer than 2.5s over 10m. A user-facing RPC that slow points to a handler regression — check the handler's downstream dependencies (database, external APIs)."

  # Slow calls at 0.06 a second, just over the 0.05 floor -> fires.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Sync", grpc_type="unary", le="2.5"}'
