      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Ship", grpc_type="unary", le="1"}'
        values: '0+3.3x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Ship", grpc_type="unary", le="5"}'
        values: '0+3.3x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Ship", grpc_type="unary", le="+Inf"}'
        values: '0+3.3x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="Ship", grpc_type="unary"}'
        values: '0+3.3x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GRPCLatencyBucketMissing
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              grpc_service: shop.Cart
              grpc_method: Ship
            exp_annotations:
              summary: "gRPC method shop.Cart/Ship: latency cannot be judged, histogram has no 2.5s bucket"
              description: "shop.Cart/Ship serves traffic, but its grpc_server_handling_seconds histogram has no le=\"2.5\" bucket, so GRPCHighLatency cannot judge it. go-grpc-prometheus's default buckets (0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10) include it: restore them, or add 2.5 to your own buckets."

  # The same at exactly 0.05 calls a second -> silent: the floor is more than 0.05/s.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Ship", grpc_type="unary", le="1"}'
        values: '0+3x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Ship", grpc_type="unary", le="5"}'
        values: '0+3x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Ship", grpc_type="unary", le="+Inf"}'
        values: '0+3x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="Ship", grpc_type="unary"}'
        values: '0+3x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GRPCLatencyBucketMissing
        exp_alerts: []

  # 1.0000002% slower than 2.5s: 989,999,998 of 1,000,000,000 calls a minute under 2.5s -> fires,
  # and the description says "Just over 1%" where four significant digits would print 1%.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Bulk", grpc_type="unary", le="2.5"}'
        values: '0+989999998x40'
      - series: 'grpc_server_handling_seconds_bucket{grpc_service="shop.Cart", grpc_method="Bulk", grpc_type="unary", le="+Inf"}'
        values: '0+1000000000x40'
      - series: 'grpc_server_handling_seconds_count{grpc_service="shop.Cart", grpc_method="Bulk", grpc_type="unary"}'
        values: '0+1000000000x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GRPCHighLatency
        exp_alerts:
          - exp_labels:
              severity: p2
              team: platform
              grpc_service: shop.Cart
              grpc_method: Bulk
            exp_annotations:
              summary: "gRPC method shop.Cart/Bulk: more than 1% of calls slower than 2.5s"
              description: "Just over 1% of calls to shop.Cart/Bulk took longer than 2.5s over 10m. A user-facing RPC that slow points to a handler regression — check the handler's downstream dependencies (database, external APIs)."

  # One server, 10% of its calls slower than 2.5s at 1 call/s throughout. One scrape fails at 5m
  # (Prometheus writes a staleness marker), then scrapes resume. Firing is due at ~11m.
  - interval: 1m
    input_series:
      - {series: 'grpc_server_handling_seconds_bucket{job="api", instance="a", grpc_service="s", grpc_method="m", le="2.5"}', values: '0+54x4 stale 270+54x30'}
      - {series: 'grpc_server_handling_seconds_count{job="api", instance="a", grpc_service="s", grpc_method="m"}', values: '0+60x4 stale 300+60x30'}
    alert_rule_test:
      - eval_time: 12m
        alertname: GRPCHighLatency
        exp_alerts:
          - exp_labels: {grpc_service: s, grpc_method: m, severity: p2, team: platform}
            exp_annotations:
              summary: "gRPC method s/m: more than 1% of calls slower than 2.5s"
              description: "10% of calls to s/m took longer than 2.5s over 10m. A user-facing RPC that slow points to a handler regression — check the handler's downstream dependencies (database, external APIs)."

  # One method, two jobs: api's histogram has the 2.5s bucket and gets one call every 5m, every
  # one slow; legacy's has no 2.5s bucket and gets 60 fast calls a minute. The floor counts only
  # the calls the share judges, api's 0.0033 a second -> GRPCHighLatency silent.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{job="api", instance="a", grpc_service="s", grpc_method="m", le="2.5"}'
        values: '0x40'
      - series: 'grpc_server_handling_seconds_bucket{job="api", instance="a", grpc_service="s", grpc_method="m", le="+Inf"}'
        values: '0+0.2x40'
      - series: 'grpc_server_handling_seconds_count{job="api", instance="a", grpc_service="s", grpc_method="m"}'
        values: '0+0.2x40'
      - series: 'grpc_server_handling_seconds_bucket{job="legacy", instance="b", grpc_service="s", grpc_method="m", le="1"}'
        values: '0+60x40'
      - series: 'grpc_server_handling_seconds_bucket{job="legacy", instance="b", grpc_service="s", grpc_method="m", le="+Inf"}'
        values: '0+60x40'
      - series: 'grpc_server_handling_seconds_count{job="legacy", instance="b", grpc_service="s", grpc_method="m"}'
        values: '0+60x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: GRPCHighLatency, exp_alerts: []}

  # A histogram stops exporting its 2.5s bucket at 21m (a staleness marker) while its count goes
  # on at 60 fast calls a minute. last_over_time keeps the old bucket until 30m, so
  # GRPCLatencyBucketMissing is pending at 30m and fires at 40m. GRPCHighLatency reads the
  # fading bucket against the full count for several minutes, and its 10m `for:` keeps that
  # from firing.
  - interval: 1m
    input_series:
      - series: 'grpc_server_handling_seconds_bucket{job="api", grpc_service="s", grpc_method="m", le="2.5"}'
        values: '0+60x20 stale'
      - series: 'grpc_server_handling_seconds_count{job="api", grpc_service="s", grpc_method="m"}'
        values: '0+60x50'
    promql_expr_test:
      - expr: 'ALERTS{alertname="GRPCLatencyBucketMissing"}'
        eval_time: 30m
        exp_samples:
          - labels: 'ALERTS{alertname="GRPCLatencyBucketMissing", alertstate="pending", grpc_service="s", grpc_method="m", severity="p2", team="platform"}'
            value: 1
    alert_rule_test:
      - {eval_time: 29m, alertname: GRPCHighLatency, exp_alerts: []}
      - {eval_time: 30m, alertname: GRPCHighLatency, exp_alerts: []}
      - {eval_time: 39m, alertname: GRPCLatencyBucketMissing, exp_alerts: []}
      - eval_time: 40m
        alertname: GRPCLatencyBucketMissing
        exp_alerts:
          - exp_labels: {grpc_service: s, grpc_method: m, severity: p2, team: platform}
            exp_annotations:
              summary: "gRPC method s/m: latency cannot be judged, histogram has no 2.5s bucket"
              description: "s/m serves traffic, but its grpc_server_handling_seconds histogram has no le=\"2.5\" bucket, so GRPCHighLatency cannot judge it. go-grpc-prometheus's default buckets (0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10) include it: restore them, or add 2.5 to your own buckets."
